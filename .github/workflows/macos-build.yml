# .github/workflows/macos-build.yml

name: Build macOS Application

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          
      - name: Install macOS build dependencies via Homebrew
        run: |
          brew install portaudio
          brew install create-dmg
          # --- [THE FIX]: Install ImageMagick to get the 'convert' command ---
          brew install imagemagick
      
      - name: Download and prepare static FFmpeg
        run: |
          mkdir -p bin
          curl -L "https://www.osxexperts.net/ffmpeg61arm.zip" -o ffmpeg.zip
          unzip -o -j ffmpeg.zip 'ffmpeg' -d bin/

      - name: Create Placeholders for Build
        # This step will now succeed because 'convert' will be available.
        # It's still best to add 'dmg_background.png' to your repo's 'assets' folder!
        run: |
          mkdir -p assets
          curl -L "https://raw.githubusercontent.com/pyinstaller/pyinstaller/v6.9.0/PyInstaller/bootloader/images/icon-windowed.icns" -o "assets/logo.icns"
          if [ ! -f "assets/dmg_background.png" ]; then
             echo "Warning: assets/dmg_background.png not found. Creating a placeholder."
             convert -size 640x440 xc:black -gravity center -fill white -pointsize 48 -annotate 0 "AutoVerse" assets/dmg_background.png
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build .app with PyInstaller
        run: pyinstaller AutoVerse.spec

      - name: Zip the .app bundle for the updater
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/AutoVerse.app dist/AutoVerse-macOS-App.zip

      - name: Create DMG Installer
        run: |
          create-dmg \
            --volname "AutoVerse Installer" \
            --window-pos 200 120 \
            --window-size 640 440 \
            --icon-size 120 \
            --text-size 14 \
            --background "assets/dmg_background.png" \
            --app-drop-link 220 300 \
            --icon "AutoVerse.app" 220 120 \
            "dist/AutoVerse-macOS-Installer.dmg" \
            "dist/AutoVerse.app"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Release-Artifacts
          path: |
            dist/AutoVerse-macOS-Installer.dmg
            dist/AutoVerse-macOS-App.zip