# .github/workflows/windows-build.yml

name: Build Windows Executable
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Create Placeholder Icon
        run: |
          New-Item -ItemType Directory -Force -Path "assets"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/pyinstaller/pyinstaller/v6.9.0/PyInstaller/bootloader/images/icon-windowed.ico" -OutFile "assets\\logo.ico"
        shell: powershell
      - name: Download and prepare FFmpeg
        run: |
          New-Item -ItemType Directory -Force -Path "bin"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full.7z" -OutFile "ffmpeg.7z"
          7z x ffmpeg.7z
          Copy-Item "ffmpeg-*-full_build/bin/ffmpeg.exe" "bin/ffmpeg.exe"
        shell: powershell
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build with PyInstaller
        run: pyinstaller AutoVerse.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        shell: powershell
        
      # --- THIS IS THE FIX ---
      # Find the Inno Setup Compiler (iscc.exe) dynamically from the PATH 
      # instead of using a hardcoded path. This is more robust.
      - name: Build Installer with Inno Setup
        run: |
          $ISCC_PATH = (Get-Command iscc.exe).Source
          & $ISCC_PATH "installer.iss"
        shell: powershell
      # --- END OF FIX ---
      
      - name: Create Clean Zip Archive for Auto-Updater
        run: |
          cd dist/AutoVerse_App
          7z a ../AutoVerse-Windows-App.zip *
        shell: powershell

      - name: Organize Artifacts
        run: Move-Item -Path dist/Output/AutoVerse-Windows-Setup.exe -Destination dist/
        shell: powershell

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Release-Artifacts
          path: |
            dist/AutoVerse-Windows-Setup.exe
            dist/AutoVerse-Windows-App.zip