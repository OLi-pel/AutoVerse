# .github/workflows/windows-build.yml

name: Build Windows Executable
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Create Placeholder Icon
        run: |
          New-Item -ItemType Directory -Force -Path "assets"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/pyinstaller/pyinstaller/v6.9.0/PyInstaller/bootloader/images/icon-windowed.ico" -OutFile "assets\logo.ico"
        shell: powershell
      - name: Download and prepare FFmpeg
        run: |
          New-Item -ItemType Directory -Force -Path "bin"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full.7z" -OutFile "ffmpeg.7z"
          7z x ffmpeg.7z
          Copy-Item "ffmpeg-*-full_build/bin/ffmpeg.exe" "bin/ffmpeg.exe"
        shell: powershell
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Build with PyInstaller
        run: pyinstaller AutoVerse.spec

      # --- [STEP 1: Install Inno Setup using Chocolatey package manager] ---
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        shell: powershell

      # --- [STEP 2: Build the .exe installer using the script we created] ---
      - name: Build Installer with Inno Setup
        run: |
          $ISCC = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $ISCC "installer.iss"
        # The output installer will be in a new 'dist/Output' directory
        shell: powershell

      # --- [STEP 3: Create the .zip file for the auto-updater] ---
      - name: Create Zip Archive for Auto-Updater
        # This zips the CONTENTS of the PyInstaller output folder, which is what your updater expects
        run: Compress-Archive -Path dist/AutoVerse_App/* -DestinationPath dist/AutoVerse-Windows-App.zip
        shell: powershell
        
      # --- [STEP 4: Upload both the installer and the zip file] ---
      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Release-Artifacts
          path: |
            dist/Output/AutoVerse-Setup.exe
            dist/AutoVerse-Windows-App.zip