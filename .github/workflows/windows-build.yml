name: Build Windows Executable
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Create Placeholder Icon
        run: |
          New-Item -ItemType Directory -Force -Path "assets"
          if (-not (Test-Path "assets\logo.ico")) {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/pyinstaller/pyinstaller/v6.9.0/PyInstaller/bootloader/images/icon-windowed.ico" -OutFile "assets\logo.ico"
          }
        shell: powershell

      - name: Cache FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: bin/ffmpeg.exe
          key: ${{ runner.os }}-ffmpeg-release-full

      - name: Download and prepare FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force -Path "bin"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full.7z" -OutFile "ffmpeg.7z"
          7z x ffmpeg.7z
          Copy-Item "ffmpeg-*-full_build/bin/ffmpeg.exe" "bin/ffmpeg.exe"
        shell: powershell

      - name: Install Python dependencies
        run: |
          # 1. Force Install SPECIFIC PyTorch version compatible with older CPUs
          uv pip install --system torch==2.3.1 torchvision==0.18.1 torchaudio==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          
          # 2. Filter requirements to remove torch (since we just installed it)
          Get-Content requirements.txt | Where-Object { $_ -notmatch '^torch' } | Set-Content requirements_filtered.txt
          
          # 3. Install remaining dependencies
          uv pip install --system -r requirements_filtered.txt
        shell: powershell

      - name: Build with PyInstaller
        # We purposely do NOT set CUDA_VISIBLE_DEVICES here during build
        run: pyinstaller AutoVerse.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        shell: powershell
        
      - name: Build Installer with Inno Setup
        run: |
          $ISCC_PATH = (Get-Command iscc.exe).Source
          & $ISCC_PATH "installer.iss"
        shell: powershell
      
      - name: Create Clean Zip Archive for Auto-Updater
        run: |
          cd dist/AutoVerse_App
          7z a ../AutoVerse-Windows-App.zip *
        shell: powershell

      - name: Organize Artifacts
        run: Move-Item -Path Output/AutoVerse-Windows-Setup.exe -Destination dist/
        shell: powershell

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Release-Artifacts
          path: |
            dist/AutoVerse-Windows-Setup.exe
            dist/AutoVerse-Windows-App.zip